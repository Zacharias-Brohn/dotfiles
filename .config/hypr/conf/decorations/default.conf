# ----------------------------------------------------- 
# General window decoration
# name: "Default"
# ----------------------------------------------------- 
general {
	border_size = 1
	col.inactive_border = rgba(ffffff10) rgba(ffffff10) 90deg
	col.active_border = rgba(ffffff10) rgba(ffffff10) 90deg
	gaps_in = 2
	gaps_out = 4
	layout = dwindle
	resize_on_border = true
	allow_tearing = true
}

decoration {
	rounding = 10
	rounding_power = 2
	blur {
		enabled = true
		size = 8
		passes = 3
		new_optimizations = on
		ignore_opacity = true
		contrast = 1.0
		brightness = 1.0
		vibrancy = 0
		vibrancy_darkness = 0
		xray = false
		noise = 0.05
		popups = true
		popups_ignorealpha = 0.6
		input_methods = true
	}
	active_opacity = 1.0
	inactive_opacity = 1.0
	dim_inactive = true
	dim_strength = 0.0
	fullscreen_opacity = 1.0
	border_part_of_window = true

	shadow {
		enabled = true
		range = 100
		render_power = 4
		color = 0x66000000
		color_inactive = 0x33000000
		offset = 0, 10
		scale = 1
	}
}
